packages:
  - "packages/*"
allowBuilds:
  "@swc/core": true
  esbuild: true
# Pin Vitest's Vite to 6 so TypeScript experimental decorators continue to
# transform via esbuild (Vite 8 / oxc does not support them).
overrides:
  "vitest>vite": "6.4.3"
  "@vitest/mocker>vite": "6.4.3"
minimumReleaseAgeExclude:
  - "@wolfstar/http-framework-test-utils@3.0.1"
  - "@wolfstar/http-framework@3.1.0"
  - "vite@6.4.3"
  - "@wolfstar/i18next-type-generator@3.1.0-next-20260830180323"
