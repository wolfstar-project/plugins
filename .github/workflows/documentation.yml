name: documentation

on:
    push:
        branches:
            - main
        tags:
            - 'v*'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    docs:
        name: Documentation
        uses: wolfstar-project/.github/.github/workflows/reusable-documentation.yml@0c9e884aa0e5430520a1f8b81c9bd73808e4854b # main
        with:
            project-name: plugins
            docgen-command: pnpm exec typedoc --options typedoc.json --json docs-output/api.json
            docs-repository: wolfstar-project/docs
        secrets:
            WOLFSTAR_TOKEN: ${{ secrets.WOLFSTAR_TOKEN }}
