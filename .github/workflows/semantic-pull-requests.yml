name: Semantic Pull Requests

on:
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  semantic-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    if: github.repository == 'wolfstar-project/plugins'
    permissions:
      contents: read
      pull-requests: write # read the PR and post or delete the sticky comment
      statuses: write
    steps:
      - name: Validate PR title
        id: lint_pr_title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            plugin-api
            plugin-broker
            plugin-i18next
            plugin-logger
            plugin-gateway
            plugin-cache
            plugin-opentelemetry
            plugin-scheduled-tasks
            plugin-sharder
            plugin-subcommands-advanced
            gateway
            cache
            sharder
            deps
            release
            ci

          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            did not match the configured pattern. Please ensure that the subject
            does not start with an uppercase character.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # When the previous step fails, the workflow would stop. This condition
        # keeps it going so the error message can be posted.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            Pull request titles need to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), and it looks like this one needs a small adjustment.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete the previous comment once the title has been fixed
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-lint-error
          delete: true
