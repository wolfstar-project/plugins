# Existing privileged PR automation is intentionally isolated to these workflows:
# they do not checkout pull request head code, and they only comment or set status.
rules:
  dangerous-triggers:
    ignore:
      - semantic-pull-requests.yml
  # The release job checkout intentionally persists WOLFSTAR_TOKEN (no
  # persist-credentials: false) so git reads and any CLI fallback keep working
  # while changesets/action pushes version-bump commits, tags, and the release
  # PR with the same token passed through its `github-token` input.
  artipacked:
    ignore:
      - release.yml
